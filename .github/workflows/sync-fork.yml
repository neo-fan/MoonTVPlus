name: Sync fork with upstream

# 自动把上游 mtvpls/MoonTVPlus 的更新合并进本 fork。
# 每 6 小时跑一次，也可以在 Actions 页面手动触发。
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 上游会修改 .github/workflows/ 下的文件，而默认的 GITHUB_TOKEN
          # 没有 workflow 权限，推送会被拒绝。这里改用带 workflow 权限的
          # 仓库 secret（PAT）来完成 checkout 和后续 push。
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || \
            git remote set-url upstream https://github.com/mtvpls/MoonTVPlus.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "Synced to $(git rev-parse --short upstream/main)."
